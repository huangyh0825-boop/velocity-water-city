<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>极速水城 · R4车手与AI同级视觉验收</title><style>body{margin:0;padding:32px;background:#0b1720;color:#e3eff5;font:16px/1.6 system-ui}main{max-width:1600px;margin:auto}h1{font-size:28px}p{max-width:1050px;color:#aabcc9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:24px}figure{margin:0;background:#142633;border:1px solid #2a4558;border-radius:12px;overflow:hidden}img{width:100%;display:block}figcaption{padding:14px}button{float:right;background:#254c64;color:white;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}a{color:#71d8ff}small{color:#b0c4d2}@media(max-width:650px){body{padding:12px}.grid{display:block}figure{margin-bottom:20px}}</style><main><h1>R4车手真人化 / 玩家与AI同级资产</h1><p>全部来自实际Three.js游戏渲染，1600×1000。前三张可以切换同机位的上一版。近景与合影为开发测试页摆位；驾驶、转弯、腾空、特技使用现有控制和物理。并排图由合法直道相邻位置启动原有玩家/AI控制器后截取，不代表完整一场比赛。</p><p>本轮重点是贴合人体的装备、胸椎/锁骨骑姿与AI同级模型。仍是CC0人体深度适配的原创角色，皮肤并非扫描材质，没有面部或布料模拟；商业游戏级真人感仍需用户看图验收。五人密集同屏的GPU成本较高。</p><p><a href="../rider-ai-validation.md">修改、来源、测试和已知限制</a> · <a href="visual-results.json">同级资产检查</a> · <a href="runtime-results.json">性能与重启测试</a></p><div class="grid"><figure><a href="rider-front.png" target="_blank"><img src="rider-front.png" alt="玩家车手正面近景"></a><figcaption>1. 玩家车手正面近景<button data-name="rider-front">显示上一版</button><br><small>实际游戏渲染</small></figcaption></figure><figure><a href="rider-side.png" target="_blank"><img src="rider-side.png" alt="玩家车手侧面近景"></a><figcaption>2. 玩家车手侧面近景<button data-name="rider-side">显示上一版</button><br><small>实际游戏渲染</small></figcaption></figure><figure><a href="mounted.png" target="_blank"><img src="mounted.png" alt="骑乘快艇近景"></a><figcaption>3. 骑乘快艇近景<button data-name="mounted">显示上一版</button><br><small>实际游戏渲染</small></figcaption></figure><figure><a href="driving.png" target="_blank"><img src="driving.png" alt="正常第三人称驾驶"></a><figcaption>4. 正常第三人称驾驶<br><small>实际游戏渲染</small></figcaption></figure><figure><a href="ai-single.png" target="_blank"><img src="ai-single.png" alt="AI快艇和车手"></a><figcaption>5. AI快艇和车手<br><small>静态合影摆位；模型、光照为游戏原生实现</small></figcaption></figure><figure><a href="same-field.png" target="_blank"><img src="same-field.png" alt="玩家与AI同场"></a><figcaption>6. 玩家与AI同场<br><small>静态合影摆位；模型、光照为游戏原生实现</small></figcaption></figure><figure><a href="multiple-ai.png" target="_blank"><img src="multiple-ai.png" alt="四名AI同场"></a><figcaption>7. 四名AI同场<br><small>静态合影摆位；模型、光照为游戏原生实现</small></figcaption></figure><figure><a href="parallel-racing.png" target="_blank"><img src="parallel-racing.png" alt="玩家与AI并排行驶"></a><figcaption>8. 玩家与AI并排行驶<br><small>相邻直道测试初态，现有控制器运行后截帧</small></figcaption></figure><figure><a href="turning.png" target="_blank"><img src="turning.png" alt="键盘转弯"></a><figcaption>9. 键盘转弯<br><small>实际游戏渲染</small></figcaption></figure><figure><a href="acceleration-close.png" target="_blank"><img src="acceleration-close.png" alt="加速前倾近景"></a><figcaption>10. 加速前倾近景<br><small>实际游戏渲染</small></figcaption></figure><figure><a href="airborne-close.png" target="_blank"><img src="airborne-close.png" alt="真实跳台腾空"></a><figcaption>11. 真实跳台腾空<br><small>实际游戏渲染</small></figcaption></figure><figure><a href="air-trick-close.png" target="_blank"><img src="air-trick-close.png" alt="空中特技姿态"></a><figcaption>12. 空中特技姿态<br><small>实际游戏渲染</small></figcaption></figure></div><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const img=b.closest('figure').querySelector('img'),before=b.dataset.before!=='1';img.src=(before?'before-':'')+b.dataset.name+'.png';b.dataset.before=before?'1':'0';b.textContent=before?'显示本轮版本':'显示上一版';});</script></main></html>
